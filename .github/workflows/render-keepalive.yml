name: Render keepalive

on:
  schedule:
    # Render free services can sleep after inactivity. This lightweight
    # liveness request keeps the existing API warm and complements UptimeRobot.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://truemailer-api.onrender.com/health
