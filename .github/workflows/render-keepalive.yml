name: Render keepalive

# Render is currently suspended by the owner. Keep this workflow manual-only
# until the Render service is resumed; otherwise scheduled pings return 503 and
# generate repeated GitHub failure emails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://truemailer-api.onrender.com/health
